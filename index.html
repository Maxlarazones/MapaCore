<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concentraciones por Ceuta del 2 de septiembre — La Razón</title>
<meta name="description" content="Mapa de las concentraciones convocadas el 2 de septiembre, Día de Ceuta: ciudad, hora, lugar y quién convoca.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="lrmap.css">

<style>
  html, body { margin: 0; background: transparent; font-family: Archivo, system-ui, sans-serif; }

  /* --- Marcador: círculo + rótulo. Todo local a este mapa. --- */
  .cc { position: relative; width: 26px; height: 26px; --r: 6px; }
  .cc--doble { --r: 8.5px; }
  .cc__punto {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: calc(var(--r) * 2); height: calc(var(--r) * 2);
    border-radius: 50%; background: #c5161d; border: 1.5px solid #fbfaf8;
    box-sizing: border-box;
  }
  .cc--hueco .cc__punto { background: #fbfaf8; border: 2.5px solid #c5161d; }
  .cc__nombre {
    position: absolute; white-space: nowrap; pointer-events: none;
    font-size: 11px; font-weight: 600; color: #1b1a18; line-height: 1;
    text-shadow: 0 0 3px #fbfaf8, 0 0 3px #fbfaf8, 0 0 4px #fbfaf8;
  }
  .cc--abajo  .cc__nombre { left: 50%; top: calc(50% + var(--r) + 4px); transform: translateX(-50%); }
  .cc--arriba .cc__nombre { left: 50%; top: calc(50% - var(--r) - 4px); transform: translate(-50%, -100%); }
  .cc--izq    .cc__nombre { right: calc(50% + var(--r) + 4px); top: 50%; transform: translateY(-50%); }
  .cc--der    .cc__nombre { left: calc(50% + var(--r) + 4px); top: 50%; transform: translateY(-50%); }

  /* Signo hueco en la leyenda, sin tocar el CSS del núcleo */
  .lrmap__clave-lista li[data-id="19:00"] .lrmap__signo {
    background: #fbfaf8; box-shadow: inset 0 0 0 2px #c5161d;
  }

  /* --- Lista de convocatorias dentro de la ficha --- */
  .acto { padding: 9px 0; border-top: 1px solid #e6e2da; }
  .acto:first-child { border-top: 0; padding-top: 2px; }
  .acto__hora { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; margin-right: 7px; }
  .acto__lugar { font-size: 13px; }
  .acto__quien { display: block; margin-top: 3px; font-size: 12px; color: #55524c; }
  .acto__nota { display: block; margin-top: 3px; font-size: 11.5px; color: #857f76; }
  .acto__tipo {
    display: inline-block; margin-top: 5px; padding: 1px 6px;
    font-size: 10.5px; border: 1px solid #d8d2c7; color: #55524c;
  }

  [data-tema="noche"] .cc__nombre { color: #f3f1ed; text-shadow: 0 0 3px #1a1c1d, 0 0 4px #1a1c1d; }
  [data-tema="noche"] .acto { border-color: #303436; }
  [data-tema="noche"] .acto__quien { color: #b6b2ab; }
</style>
</head>
<body>

<div id="mapa"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="lrmap.js"></script>
<script>
/* ---------------------------------------------------------------------------
   Datos. Para actualizar el mapa se toca SOLO esta lista.
   corto  = texto junto al punto;  pos = dónde se coloca (abajo|arriba|izq|der)
   --------------------------------------------------------------------------- */
var CIUDADES = [
  { id:'madrid', nombre:'Madrid', corto:'Madrid', pos:'izq', lat:40.4180, lon:-3.7010, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Congreso de los Diputados', quien:'Convocatoria ciudadana «Por Ceuta»', tipo:'ciudadana' },
      { hora:'20:00', lugar:'Plaza de Cibeles', quien:'Ayuntamiento de Madrid / FEMP', tipo:'institucional' } ] },

  { id:'barcelona', nombre:'Barcelona', corto:'Barcelona', pos:'der', lat:41.3850, lon:2.1734, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Plaça de Sant Jaume', quien:'PP de Barcelona', tipo:'partido' },
      { hora:'20:00', lugar:'Plaça de Catalunya', quien:'Sectores de la convocatoria ciudadana', tipo:'ciudadana' } ] },

  { id:'ceuta', nombre:'Ceuta', corto:'Ceuta', pos:'abajo', lat:35.8890, lon:-5.3190, hora:'19:00', actos:[
      { hora:'19:00', lugar:'De las Murallas Reales a la Plaza de los Reyes', quien:'FPAV y Foro Ceuta Siglo XXI', tipo:'ciudadana',
        nota:'Marcha con lectura de manifiesto al final del recorrido' } ] },

  { id:'sevilla', nombre:'Sevilla', corto:'Sevilla', pos:'abajo', lat:37.3891, lon:-5.9845, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Plaza Nueva', quien:'Ayuntamiento / FEMP', tipo:'institucional' } ] },

  { id:'malaga', nombre:'Málaga', corto:'Málaga', pos:'abajo', lat:36.7213, lon:-4.4214, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Puerta del Ayuntamiento, avenida de Cervantes 4', quien:'Ayuntamiento', tipo:'institucional' } ] },

  { id:'cordoba', nombre:'Córdoba', corto:'Córdoba', pos:'izq', lat:37.8882, lon:-4.7794, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Ayuntamiento, calle Capitulares', quien:'Ayuntamiento / FEMP', tipo:'institucional' } ] },

  { id:'huelva', nombre:'Huelva', corto:'Huelva', pos:'izq', lat:37.2614, lon:-6.9447, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Puerta del Ayuntamiento', quien:'Ayuntamiento / FEMP', tipo:'institucional' } ] },

  { id:'jaen', nombre:'Jaén', corto:'Jaén', pos:'der', lat:37.7796, lon:-3.7849, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Plaza de las Batallas', quien:'Convocatoria ciudadana', tipo:'ciudadana',
        nota:'Acto independiente del convocado por el Ayuntamiento' } ] },

  { id:'valencia', nombre:'València', corto:'València', pos:'der', lat:39.4699, lon:-0.3763, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Plaza del Ayuntamiento', quien:'Ayuntamiento / FEMP', tipo:'institucional' } ] },

  { id:'zaragoza', nombre:'Zaragoza', corto:'Zaragoza', pos:'arriba', lat:41.6488, lon:-0.8891, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Plaza del Pilar', quien:'Ayuntamiento', tipo:'institucional' } ] },

  { id:'guadalajara', nombre:'Guadalajara', corto:'Guadalajara', pos:'der', lat:40.6288, lon:-3.1613, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Plaza Mayor', quien:'Ayuntamiento', tipo:'institucional' } ] },

  { id:'coruna', nombre:'A Coruña', corto:'A Coruña', pos:'abajo', lat:43.3623, lon:-8.4115, hora:'20:00', actos:[
      { hora:'20:00', lugar:'Plaza de María Pita', quien:'Convocatoria municipal', tipo:'institucional' } ] },

  { id:'laspalmas', nombre:'Las Palmas de Gran Canaria', corto:'Las Palmas', pos:'der', lat:28.1235, lon:-15.4363, hora:'19:00', actos:[
      { hora:'19:00', lugar:'Plaza de Santa Ana', quien:'Convocatoria local', tipo:'institucional' } ] },

  { id:'telde', nombre:'Telde', corto:'Telde', pos:'abajo', lat:27.9985, lon:-15.4167, hora:'19:00', actos:[
      { hora:'19:00', lugar:'Plaza de San Juan', quien:'Convocatoria local', tipo:'institucional' } ] },

  { id:'puertorosario', nombre:'Puerto del Rosario', corto:'Puerto del Rosario', pos:'abajo', lat:28.5004, lon:-13.8627, hora:'19:00', actos:[
      { hora:'19:00', lugar:'Junto al Ayuntamiento', quien:'Convocatoria local', tipo:'institucional' } ] },

  { id:'tenerife', nombre:'Santa Cruz de Tenerife', corto:'S. C. de Tenerife', pos:'izq', lat:28.4636, lon:-16.2518, hora:'19:00', actos:[
      { hora:'19:00', lugar:'Frente al Ayuntamiento', quien:'Convocatoria institucional', tipo:'institucional' } ] }
];

var ETIQUETA_TIPO = {
  institucional: 'Convocatoria institucional',
  ciudadana: 'Convocatoria ciudadana',
  partido: 'Convocatoria de partido'
};

/* --------------------------------------------------------------------------- */

var geojson = {
  type: 'FeatureCollection',
  features: CIUDADES.map(function (c) {
    return {
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [c.lon, c.lat] },
      properties: {
        id: c.id, titulo: c.nombre, corto: c.corto, pos: c.pos,
        hora: c.hora, categoria: c.hora, valor: c.actos.length, actos: c.actos
      }
    };
  })
};

var mapa = LRMap.crear({
  el: '#mapa',
  titulo: 'Dónde se concentra España por Ceuta',
  entradilla: 'Convocatorias del miércoles 2 de septiembre, Día de Ceuta. Coinciden actos institucionales impulsados por la FEMP, convocatorias ciudadanas y llamamientos de partidos, con lugares distintos dentro de una misma ciudad.',
  fuente: { texto: 'FEMP, ayuntamientos y convocantes' },
  actualizado: '2026-09-01T09:00:00+02:00',
  nota: 'Selección de convocatorias verificadas una por una. No es un listado completo: la plataforma Por Ceuta y la FEMP contabilizan más de 260 municipios adheridos. Los puntos señalan la ciudad; el lugar exacto figura en el detalle.',

  leyenda: {
    titulo: 'Hora de inicio',
    items: [
      { id: '20:00', etiqueta: 'A las 20:00', color: '#c5161d', filtrable: true },
      { id: '19:00', etiqueta: 'A las 19:00 (Canarias y Ceuta)', color: '#c5161d', filtrable: true }
    ],
    nota: 'El círculo mayor indica dos convocatorias distintas en la misma ciudad'
  },

  // Marcador propio: círculo + nombre. Un solo color; distinguimos por relleno
  // y tamaño, para que el mapa no se lea como un reparto de siglas políticas.
  punto: function (f, ll) {
    var p = f.properties;
    var clases = ['cc', 'cc--' + p.pos];
    if (p.valor > 1) clases.push('cc--doble');
    if (p.hora === '19:00') clases.push('cc--hueco');
    return L.marker(ll, {
      icon: L.divIcon({
        className: '',
        iconSize: [26, 26],
        iconAnchor: [13, 13],
        html: '<div class="' + clases.join(' ') + '">' +
              '<b class="cc__punto"></b>' +
              '<span class="cc__nombre">' + p.corto + '</span></div>'
      }),
      keyboard: true,
      title: p.titulo
    });
  },

  etiquetaFlotante: function (f) {
    var p = f.properties;
    return p.titulo + ' · ' + p.hora + (p.valor > 1 ? ' · 2 convocatorias' : '');
  },

  alSeleccionar: function (f) {
    var p = f.properties;
    var lista = p.actos.map(function (a) {
      var h = '<div class="acto">';
      h += '<span class="acto__hora">' + a.hora + '</span>';
      h += '<span class="acto__lugar">' + a.lugar + '</span>';
      h += '<span class="acto__quien">' + a.quien + '</span>';
      if (a.nota) h += '<span class="acto__nota">' + a.nota + '</span>';
      h += '<span class="acto__tipo">' + ETIQUETA_TIPO[a.tipo] + '</span>';
      return h + '</div>';
    }).join('');
    return {
      titulo: p.titulo,
      texto: p.valor > 1 ? 'Dos convocatorias distintas, a la misma hora y en lugares diferentes.' : '',
      html: lista
    };
  }
});

mapa.on('listo', function () { mapa.setDatos(geojson); });

document.addEventListener('lrmap:seleccion', function (e) {
  if (!window.dataLayer) return;
  dataLayer.push({
    event: 'mapa_interaccion',
    mapa_id: 'concentraciones-ceuta-2sep',
    elemento: e.detail.properties.id
  });
});
</script>
</body>
</html>
